name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Pytest
        run: |
          # If credentials are required, we can mock them or skip integrations depending on configuration.
          # For a basic run, we execute the pytest suite:
          uv run python -m pytest tests/unit tests/integration

      - name: Install Google Agents CLI
        run: uv tool install google-agents-cli

      - name: Run Linter
        run: agents-cli lint
