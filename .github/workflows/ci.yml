name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Chromium for browser tests
        run: uv run playwright install --with-deps chromium

      - name: Run credential-free tests
        run: uv run python -m pytest tests/unit tests/integration tests/browser -m "not google_cloud"

      - name: Install Google Agents CLI
        run: uv tool install google-agents-cli

      - name: Run Linter
        run: agents-cli lint
